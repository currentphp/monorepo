# Local development only; ports are bound to this machine.
services:
    laravel.test:
        build:
            context: ./docker/8.5
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: wavykit-monorepo-playground-sail:8.5
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:80'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            # Request metadata is logged safely by the application; raw URLs can contain reset tokens.
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80 --quiet'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
            - '../../packages:/var/packages:ro'
        depends_on:
            pgsql:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        networks:
            - sail

    queue:
        image: wavykit-monorepo-playground-sail:8.5
        command: php artisan queue:work --tries=3 --timeout=60
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - '../../packages:/var/packages:ro'
        depends_on:
            pgsql:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        networks:
            - sail

    pgsql:
        image: postgres:18.3-alpine
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5433}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-foundation}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - sail

    mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
            - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
